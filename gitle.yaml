{
  "run": "php -S 0.0.0.0:8000 -t backend",
  "port": 8000,
  "image": "node:22-bookworm",
  "setup": "apt-get update && apt-get install -y php-cli php-mbstring php-xml php-curl php-zip php-sqlite3 php-mysql unzip && curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer && composer install --no-interaction --prefer-dist -d backend",
  "services": [
    "mysql"
  ]
}